services:
  db:
    restart: "no"
    image: postgres:17
    container_name: lidoo-postgres

    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

    volumes:
      - lidoo-postgres-data:/var/lib/postgresql/data

    networks:
      - lidoo-net

volumes:
  lidoo-postgres-data:
    name: lidoo-postgres-data 

networks:
  lidoo-net:
    name: lidoo-net
    driver: bridge
